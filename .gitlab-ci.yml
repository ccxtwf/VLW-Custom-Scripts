# written with AI assistance by Claude

stages:
  - network-info
  - install
  - run

log_runner_ip:
  stage: network-info
  image: curlimages/curl:latest
  script:
    - curl -s https://ifconfig.me || true

install_mwn_deps:
  stage: install
  image: node:24-slim
  cache:
    key: 
      files_commits:
        - mwn/package.json
    paths:
      - mwn/.npm-cache/
  script:
    - cd mwn/
    - npm ci --cache .npm-cache/
  artifacts:
    paths:
      - mwn/node_modules/
    expire_in: 1 hour

run_producer_page_bot:
  stage: run
  image: node:24-slim
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule" && $SCHEDULE_PIPELINE_KEY == "producer_page_bot"'
    - if: '$CI_PIPELINE_SOURCE == "web" && $SCHEDULE_PIPELINE_KEY == "producer_page_bot"'
      when: manual
      allow_failure: true
  needs:
    - install_mwn_deps
  script:
    - cd mwn/
    - node producer_page_bot.ts
  artifacts:
    paths:
      - logs/
    when: always
    access: maintainer
    expire_in: 30 days